---
- name: Install and configure Docker
  hosts: all
  become: yes
  tasks:
    - name: Ensure latest apt packages
      apt:
        update_cache: yes
        
    - name: Install required dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Install Docker CE
      apt:
        name: docker-ce
        state: present

    - name: Ensure Docker runs on boot and is started
      service:
        name: docker
        state: started
        enabled: yes
