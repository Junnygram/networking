# Canary / Blue-Green Deployment for Backend v2
# The stable (blue) deployment is already in k8s/backend.yaml
# This file deploys v2 (green/canary) alongside it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: shopmicro
  labels:
    app: backend
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v2
  template:
    metadata:
      labels:
        app: backend
        version: v2
    spec:
      containers:
      - name: backend
        image: 307946680662.dkr.ecr.us-east-1.amazonaws.com/dev-shopmicro-backend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: APP_VERSION
          value: "v2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: shopmicro
spec:
  selector:
    app: backend
    version: v2
  ports:
  - port: 8080
    targetPort: 8080
---
# Canary Ingress: Routes traffic to backend-v2 using Traefik routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-canary
  namespace: shopmicro
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: shopmicro-canary-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /canary
        pathType: Prefix
        backend:
          service:
            name: backend-v2
            port:
              number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canary-strip
  namespace: shopmicro
spec:
  stripPrefix:
    prefixes:
      - /canary
