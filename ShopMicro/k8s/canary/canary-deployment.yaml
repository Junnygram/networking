# Canary / Blue-Green Deployment for Backend v2
# The stable (blue) deployment is already in k8s/backend.yaml
# This file deploys v2 (green/canary) alongside it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: shopmicro
  labels:
    app: backend
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v2
  template:
    metadata:
      labels:
        app: backend
        version: v2
    spec:
      containers:
      - name: backend
        image: your-registry/shopmicro-backend:v2
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: APP_VERSION
          value: "v2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: shopmicro
spec:
  selector:
    app: backend
    version: v2
  ports:
  - port: 8080
    targetPort: 8080
---
# Canary Ingress: Routes 20% of /api traffic to backend-v2
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-canary
  namespace: shopmicro
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
  - host: shopmicro.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-v2
            port:
              number: 8080
