apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-cronjob-sa
  namespace: shopmicro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-cronjob-role
  namespace: shopmicro
rules:
- apiGroups: [""]
  resources: ["secrets", "serviceaccounts"]
  verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-cronjob-rolebinding
  namespace: shopmicro
subjects:
- kind: ServiceAccount
  name: ecr-cronjob-sa
  namespace: shopmicro
roleRef:
  kind: Role
  name: ecr-cronjob-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-credential-refresh
  namespace: shopmicro
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-cronjob-sa
          containers:
          - name: ecr-refresh
            image: amazon/aws-cli:latest
            command:
            - /bin/sh
            - -c
            - |-
              # Install kubectl
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl
              mv kubectl /usr/local/bin/
              
              ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
              REGION=us-east-1
              SECRET_NAME=ecr-cred
              TOKEN=$(aws ecr get-login-password --region ${REGION})
              
              kubectl delete secret --ignore-not-found $SECRET_NAME -n shopmicro
              kubectl create secret docker-registry $SECRET_NAME \
                --docker-server=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com \
                --docker-username=AWS \
                --docker-password="${TOKEN}" \
                --namespace=shopmicro
              
              kubectl patch serviceaccount default -n shopmicro -p '{"imagePullSecrets":[{"name":"'$SECRET_NAME'"}]}'
          restartPolicy: OnFailure
