apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopmicro
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
      - name: frontend
        image: your-registry/shopmicro-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_BASE
          value: http://backend:8080
        - name: VITE_ML_BASE
          value: http://ml-service:5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopmicro
spec:
  selector: { app: frontend }
  ports:
  - port: 80
    targetPort: 80
    type: LoadBalancer
