apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-green
  namespace: kube-lifecycle
  labels:
    app: api-gateway
    color: green
spec:
  replicas: 0 # Initially scaled down or 0 for active/passive switch
  selector:
    matchLabels:
      app: api-gateway
      color: green
  template:
    metadata:
      labels:
        app: api-gateway
        color: green
    spec:
      containers:
      - name: api-gateway
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          failureThreshold: 30
          periodSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          name: api-gateway-config
