# Test Application: Shared Filesystem Demo
#
# Demonstrates multiple pods sharing a CephFS volume.
# All pods can read and write to the same filesystem.

---
# PVC with ReadWriteMany access
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cephfs-pvc
  labels:
    app: shared-storage-demo
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can mount read-write
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-cephfs

---
# Deployment with multiple replicas sharing storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-storage-app
  labels:
    app: shared-storage-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shared-storage-demo
  template:
    metadata:
      labels:
        app: shared-storage-demo
    spec:
      # Spread pods across nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shared-storage-demo
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              HOSTNAME=$(hostname)
              echo "Pod ${HOSTNAME} starting..."

              # Create our pod's file
              echo "Hello from ${HOSTNAME}" > /shared/${HOSTNAME}.txt

              # Continuously update and read
              while true; do
                # Write timestamp
                echo "$(date): ${HOSTNAME} heartbeat" >> /shared/activity.log

                # Show all files in shared storage
                echo "=== Files in /shared ==="
                ls -la /shared/

                # Show recent activity
                echo "=== Recent Activity ==="
                tail -10 /shared/activity.log

                sleep 10
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: cephfs-pvc

---
# Service to access the pods
apiVersion: v1
kind: Service
metadata:
  name: shared-storage-app
  labels:
    app: shared-storage-demo
spec:
  selector:
    app: shared-storage-demo
  ports:
    - port: 80
      name: http
  type: ClusterIP

---
# Nginx deployment serving shared content
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-content-server
  labels:
    app: content-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-server
  template:
    metadata:
      labels:
        app: content-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
              readOnly: true  # Read-only mount for serving
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: cephfs-pvc
            # Note: Using same PVC with ReadOnly in pod spec

---
# NodePort service to access nginx
apiVersion: v1
kind: Service
metadata:
  name: content-server
  labels:
    app: content-server
spec:
  selector:
    app: content-server
  ports:
    - port: 80
      nodePort: 30080
  type: NodePort
