# StorageClass for Ceph Block Storage
#
# This StorageClass enables dynamic provisioning of RBD volumes.
# When a PVC requests this class, Ceph automatically creates the volume.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block
  annotations:
    # Uncomment to make this the default StorageClass
    # storageclass.kubernetes.io/is-default-class: "true"
provisioner: rook-ceph.rbd.csi.ceph.com

parameters:
  # Cluster ID (namespace where Rook is deployed)
  clusterID: rook-ceph

  # Pool name (must match CephBlockPool name)
  pool: replicapool

  # RBD image format (2 is current standard)
  imageFormat: "2"

  # RBD image features (layering enables snapshots/clones)
  imageFeatures: layering

  # Secrets for CSI provisioner
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph

  # Secrets for node operations
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph

  # Filesystem type for the volume
  csi.storage.k8s.io/fstype: ext4

# What happens when PVC is deleted
reclaimPolicy: Delete

# Allow online volume expansion
allowVolumeExpansion: true

# Mount options (optional)
# mountOptions:
#   - discard

---
# StorageClass with Retain policy (for important data)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block-retain
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: replicapool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain  # PV remains after PVC deletion
allowVolumeExpansion: true
