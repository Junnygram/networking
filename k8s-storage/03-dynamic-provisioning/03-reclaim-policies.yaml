# Reclaim Policy Demonstration
#
# This file creates resources to demonstrate the difference between
# Delete and Retain reclaim policies.
#
# Exercise:
# 1. Apply this file
# 2. Note the PV names created
# 3. Delete the PVCs
# 4. Observe: Delete PV disappears, Retain PV stays (status: Released)

---
# PVC with Delete policy - PV will be deleted when PVC is deleted
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delete-policy-pvc
  labels:
    demo: reclaim-policy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: delete-storage-class

---
# PVC with Retain policy - PV will remain after PVC deletion
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retain-policy-pvc
  labels:
    demo: reclaim-policy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: retain-storage-class

---
# Pods to trigger volume creation (for WaitForFirstConsumer)
apiVersion: v1
kind: Pod
metadata:
  name: delete-policy-pod
  labels:
    demo: reclaim-policy
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'data' > /data/test.txt && sleep infinity"]
      volumeMounts:
        - name: storage
          mountPath: /data
      resources:
        limits:
          memory: "32Mi"
          cpu: "50m"
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: delete-policy-pvc

---
apiVersion: v1
kind: Pod
metadata:
  name: retain-policy-pod
  labels:
    demo: reclaim-policy
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'important data' > /data/test.txt && sleep infinity"]
      volumeMounts:
        - name: storage
          mountPath: /data
      resources:
        limits:
          memory: "32Mi"
          cpu: "50m"
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: retain-policy-pvc
